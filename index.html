<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lora99 | Premium Girls Clothing Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #fcf8f8; }
        header { background-color: #fff; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 32px; font-weight: bold; color: #e91e63; letter-spacing: 2px; }
        .nav { margin-top: 10px; }
        .nav a { margin: 0 15px; text-decoration: none; color: #333; font-weight: 600; }
        .hero { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://via.placeholder.com/1200x400'); background-size: cover; color: white; text-align: center; padding: 80px 20px; }
        .hero h1 { font-size: 40px; margin-bottom: 10px; }
        .products { display: flex; justify-content: center; gap: 20px; padding: 40px 20px; flex-wrap: wrap; }
        .card { background: white; border-radius: 8px; width: 250px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: center; }
        .card img { width: 100%; border-radius: 8px; }
        .price { color: #e91e63; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .btn-wa { background-color: #25D366; color: white; padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">LORA99</div>
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Dresses</a>
            <a href="#">Tops</a>
            <a href="#">About Us</a>
            <a href="#">Contact</a>
        </div>
    </header>

    <section class="hero">
        <h1>Discover The Latest Trends</h1>
        <p>Stylish & Comfortable Girls Clothing in Sri Lanka</p>
    </section>

    <section class="products">
        <div class="card">
            <img src="https://via.placeholder.com/250x300" alt="Casual Dress">
            <h3>Floral Summer Dress</h3>
            <div class="price">Rs. 3,250</div>
            <a href="https://wa.me/YOURNUMBER" class="btn-wa">Order via WhatsApp</a>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/250x300" alt="Party Dress">
            <h3>Elegant Party Top</h3>
            <div class="price">Rs. 2,450</div>
            <a href="https://wa.me/YOURNUMBER" class="btn-wa">Order via WhatsApp</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Lora99 Girls Clothing. All Rights Reserved.</p>
    </footer>

</body>
</html>
