
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lora99 | Premium Girls Clothing Store</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #0b0b0b; color: #fff; }
        header { background-color: #000; padding: 20px 15px; text-align: center; border-bottom: 2px solid #d4af37; }
        .logo-img { width: 130px; height: 130px; border-radius: 50%; border: 2px solid #d4af37; object-fit: cover; }
        .nav { margin-top: 15px; }
        .nav a { margin: 0 8px; text-decoration: none; color: #d4af37; font-weight: 600; font-size: 13px; text-transform: uppercase; }
        .hero { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1000'); background-size: cover; color: white; text-align: center; padding: 50px 20px; }
        .hero h1 { font-size: 24px; color: #d4af37; margin-bottom: 10px; }
        .products { display: flex; justify-content: center; gap: 20px; padding: 30px 15px; flex-wrap: wrap; }
        .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; width: 280px; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 8px; }
        .card h3 { color: #fff; font-size: 18px; margin: 10px 0; }
        .price { color: #d4af37; font-weight: bold; font-size: 20px; margin-bottom: 15px; }
        .btn-wa { background: #25D366; color: white; padding: 12px 20px; border: none; border-radius: 25px; font-weight: bold; text-decoration: none; display: block; }
        footer { background: #000; color: #888; text-align: center; padding: 20px; margin-top: 30px; font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <img src="IMG-20260806-WA0001.jpg" alt="Lora99 Clothing" class="logo-img">
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Dresses</a>
            <a href="#">Tops</a>
            <a href="#">About Us</a>
            <a href="#">Contact</a>
        </div>
    </header>
    <section class="hero">
        <h1>OWN YOUR STYLE.<br>LIVE YOUR CONFIDENCE.</h1>
        <p>Premium Girls Clothing Collection in Sri Lanka</p>
    </section>
    <section class="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?q=80&w=600" alt="Casual Dress">
            <h3>Floral Summer Dress</h3>
            <div class="price">Rs. 3,250</div>
            <a href="https://wa.me/" class="btn-wa">Order via WhatsApp</a>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1551803091-e20673f15770?q=80&w=600" alt="Party Top">
            <h3>Elegant Party Top</h3>
            <div class="price">Rs. 2,450</div>
            <a href="https://wa.me/" class="btn-wa">Order via WhatsApp</a>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 Lora99 Clothing. All Rights Reserved.</p>
    </footer>
</body>
</html>
