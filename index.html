
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lora99 | Premium Girls Clothing Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
}

header{
    background:#000;
    text-align:center;
    padding:20px;
}

.logo-img{
    width:160px;
    height:auto;
    margin-bottom:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-size:18px;
}

nav a:hover{
    color:gold;
}

.hero{
    background:linear-gradient(to right,#000,#333);
    padding:80px 20px;
    text-align:center;
}

.hero h1{
    color:gold;
    font-size:42px;
}

.hero p{
    margin-top:15px;
    font-size:18px;
    color:#ddd;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 25px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.products{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:50px 20px;
}

.card{
    background:#1a1a1a;
    width:280px;
    border-radius:10px;
    overflow:hidden;
    text-align:center;
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card h3{
    margin:15px 0;
}

.price{
    color:gold;
    font-size:22px;
    margin-bottom:15px;
}

.buy-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 20px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:25px;
}

footer{
    background:#000;
    padding:20px;
    text-align:center;
    color:#999;
}
</style>

</head>

<body>

<header>

<img src="logo.jpg" alt="Lora99 Logo" class="logo-img">

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">
<h1>Welcome to Lora99</h1>
<p>Premium Girls Fashion Collection</p>
<a href="#products" class="btn">Shop Now</a>
</section>

<section class="products" id="products">

<div class="card">
<img src="dress1.jpg" alt="Dress 1">
<h3>Elegant Dress</h3>
<p class="price">Rs.4500</p>
<a href="#" class="buy-btn">Buy Now</a>
</div>

<div class="card">
<img src="dress2.jpg" alt="Dress 2">
<h3>Casual Dress</h3>
<p class="price">Rs.3800</p>
<a href="#" class="buy-btn">Buy Now</a>
</div>

<div class="card">
<img src="dress3.jpg" alt="Dress 3">
<h3>Party Dress</h3>
<p class="price">Rs.5200</p>
<a href="#" class="buy-btn">Buy Now</a>
</div>

</section>

<footer>
<p>© 2026 Lora99. All Rights Reserved.</p>
</footer>

</body>
</html>
