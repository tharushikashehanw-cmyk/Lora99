
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lora99 | Premium Girls Clothing Store</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background-color: #121212; color: #fff; text-align: center; }
        header { background-color: #000; padding: 20px 10px; }
        .logo-img { width: 140px; height: auto; display: block; margin: 0 auto; border-radius: 8px; }
        .nav { margin-top: 15px; }
        .nav a { margin: 0 10px; text-decoration: none; color: #fff; font-weight: bold; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)); padding: 50px 20px; }
        .hero h1 { font-size: 26px; color: #fff; }
        .hero p { color: #ddd; font-size: 14px; }
        .products { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 20px; }
        .card { background: #141414; border: 1px solid #333; border-radius: 8px; padding: 15px; width: 250px; }
        .card img { width: 100%; height: 320px; object-fit: cover; border-radius: 5px; }
        .card h3 { color: #fff; font-size: 18px; margin: 10px 0 5px; }
        .price { color: #d4af37; font-weight: bold; margin-bottom: 10px; }
        .btn-wa { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 5px; display: inline-block; font-weight: bold; }
        footer { background: #000; color: #888; padding: 15px; margin-top: 30px; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpg" alt="Lora99 Logo" class="logo-img">
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Dresses</a>
            <a href="#">Tops</a>
            <a href="#">About Us</a>
            <a href="#">Contact</a>
        </div>
    </header>

    <section class="hero">
        <h1>OWN YOUR STYLE.<br>LIVE YOUR CONFIDENCE.</h1>
        <p>Premium Girls Clothing Collection in Sri Lanka</p>
    </section>

    <section class="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=500" alt="Dress">
            <h3>Floral Summer Dress</h3>
            <div class="price">Rs. 3,250</div>
            <a href="https://wa.me/" class="btn-wa">Order via WhatsApp</a>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=500" alt="Top">
            <h3>Elegant Party Top</h3>
            <div class="price">Rs. 2,450</div>
            <a href="https://wa.me/" class="btn-wa">Order via WhatsApp</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Lora99 Clothing. All rights reserved.</p>
    </footer>

</body>
</html>
